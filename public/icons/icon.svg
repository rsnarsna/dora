<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Outer Hexagon -->
  <polygon points="256,96 384,170 384,318 256,392 128,318 128,170" fill="none" stroke="url(#primaryGrad)" stroke-width="18" filter="url(#glow)" stroke-linejoin="round" />
  <!-- Inner Star / Compass Axes -->
  <line x1="256" y1="96" x2="256" y2="392" stroke="#60a5fa" stroke-width="8" stroke-dasharray="8,6" opacity="0.6" />
  <line x1="128" y1="244" x2="384" y2="244" stroke="#60a5fa" stroke-width="8" stroke-dasharray="8,6" opacity="0.6" />
  <!-- Center Core Orb -->
  <circle cx="256" cy="244" r="54" fill="url(#primaryGrad)" filter="url(#glow)" />
  <circle cx="256" cy="244" r="28" fill="#ffffff" opacity="0.9" />
  <!-- Orbiting Node Satellites -->
  <circle cx="384" cy="170" r="18" fill="#38bdf8" />
  <circle cx="128" cy="318" r="18" fill="#a855f7" />
  <circle cx="256" cy="392" r="18" fill="#10b981" />
</svg>